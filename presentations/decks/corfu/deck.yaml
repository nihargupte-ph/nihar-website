title: 'Detecting Eccentricity: what are our Current Prospects?'
date: '2026-09-01'
venue: GW eccentricity @ Corfu, Greece
subtitle: ''
transition: none
expertise:
- theory
- data analysis
- instrumentation
- not a physicist
# Matches the Canva export: near-white ground, warm ink, Baskerville Display PT headings
# (Libre Baskerville is the closest Google-Fonts stand-in), Inter body. Accents are the
# red + teal from the institute logos, used for links and the three timeline lanes.
footer:
  name: Nihar Gupte
  affiliation: MPI Grav. Phys & UMD
  bg: '#f1efe9'
  fg: '#504c44'
theme:
  bg: '#fdfdfd'
  fg: '#504c44'
  accents:
  - '#b3262e'
  - '#2a7f7a'
  - '#504c44'
  font_display: Libre Baskerville
  font_body: Inter
interactions:
- id: ecc-prior
  type: prior
  prompt: Draw your prior on eccentricity
  axis: {min: -11, max: 0, bins: 88, label: "log₁₀ e"}
  log_uniform_min: -4            # the reference log-uniform prior starts at e = 1e-4
slides:
- {id: page-01, svg: slides/01-page-01.svg, footer: false}
- {id: page-02, svg: slides/02-page-02.svg}
- id: channels
  html: 05-channels.html
