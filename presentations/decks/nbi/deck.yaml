title: What does eccentricity tell us about how binary black holes form?
date: '2026-10-20'
venue: Niels Bohr Institute @ Copenhagen, Denmark
subtitle: ''
transition: none
expertise:
- theory
- data analysis
- instrumentation
- not a physicist
# Same Canva look as the corfu deck (near-white ground, warm ink, Baskerville headings),
# so the theme, footer and the interactive slides are carried over from decks/corfu/.
footer:
  name: Nihar Gupte
  affiliation: MPI Grav. Phys & UMD
  bg: '#f1efe9'
  fg: '#504c44'
theme:
  bg: '#fdfdfd'
  fg: '#504c44'
  accents:
  - '#b3262e'
  - '#2a7f7a'
  - '#504c44'
  font_display: Libre Baskerville
  font_body: Inter
interactions:
- id: ecc-prior
  type: prior
  prompt: Draw your prior on eccentricity
  axis: {min: -11, max: 0, bins: 88, label: "log₁₀ e"}
  log_uniform_min: -4            # the reference log-uniform prior starts at e = 1e-4
  odds_threshold: -1.30103       # log10 0.05: once closed, show P(e > 0.05) and the prior odds f/(1-f)
  odds_label: "e₁₀Hz > 0.05"
slides:
- {id: page-01, svg: slides/01-page-01.svg, footer: false}
- id: page-02                       # table of contents + the QR corner
  html: 13-toc-qr.html
  underlay: slides/02-page-02.svg
- id: channels
  html: 05-channels.html
# EOB flowchart (Buonanno & Damour 1999), one box per click: six reveal steps of one slide,
# the template reads the step off the last character of the id.
- {id: eob-1, html: 15-eob.html}
- {id: eob-2, html: 15-eob.html, continues: true}
- {id: eob-3, html: 15-eob.html, continues: true}
- {id: eob-4, html: 15-eob.html, continues: true}
- {id: eob-5, html: 15-eob.html, continues: true}
- {id: eob-6, html: 15-eob.html, continues: true}
# 03-05: accelerating inference with DINGO
- {id: page-03, svg: slides/03-page-03.svg}
- {id: page-04, svg: slides/04-page-04.svg}
- {id: page-05, svg: slides/05-page-05.svg}
