{% extends "homepage/base.html" %}
{% load static %}

{% block content %}

<style>
    .mindmap-container {
        background: #1a1a2e;
        min-height: 100vh;
        padding: 0;
    }

    .mindmap-header {
        padding: 1em 2em;
        color: #ffffff;
        text-align: center;
        background: #1a1a2e;
    }

    .mindmap-header h2 {
        color: #ffffff;
        margin-bottom: 0.5em;
    }

    .mindmap-header p {
        color: #cccccc;
        margin-bottom: 0;
    }

    .viewer-wrapper {
        position: relative;
        width: 100%;
        height: calc(100vh - 200px);
        min-height: 500px;
        background: #1F2429;
        border: 1px solid #333;
        overflow: hidden;
        margin-top: 2em;
    }

    #svg-container {
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: contain;
    }

    #svg-container:active {
        cursor: grabbing;
    }

    #svg-container object {
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    #panzoom-content {
        width: 100%;
        height: 100%;
        position: relative;
    }

    #overlay-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    .concept-target {
        position: absolute;
        pointer-events: auto;
        cursor: pointer;
    }

    .concept-target.hit {
        background: rgba(74, 158, 255, 0.18);
        border-radius: 2px;
    }

    .concept-target.hit-active {
        background: rgba(74, 158, 255, 0.38);
    }

    .concept-target.hit-flash {
        animation: hitflash 0.9s ease-out 2;
    }

    @keyframes hitflash {
        0%, 100% { background: rgba(74, 158, 255, 0.38); }
        50% { background: rgba(123, 104, 238, 0.6); }
    }

    /* Control buttons */
    .viewer-controls {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .viewer-controls button {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        font-size: 18px;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .viewer-controls button:hover {
        background: #ffffff;
    }

    .viewer-controls button:active {
        background: #e0e0e0;
    }

    /* Loading indicator */
    .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 10, 21, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
        color: #fff;
        transition: opacity 0.4s ease-out;
    }

    .loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .loading-text {
        font-size: 1.4em;
        margin-bottom: 20px;
        font-weight: 300;
        letter-spacing: 0.5px;
    }

    .loading-bar-container {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
    }

    .loading-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #4a9eff, #7b68ee);
        border-radius: 2px;
        transition: width 0.3s ease-out;
    }

    .loading-bar.indeterminate {
        width: 30%;
        animation: indeterminate 1.5s ease-in-out infinite;
    }

    @keyframes indeterminate {
        0% {
            transform: translateX(-100%);
        }
        100% {
            transform: translateX(400%);
        }
    }

    .search-bar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1001;
        width: min(420px, calc(100% - 130px));
    }
    #concept-search {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #444;
        border-radius: 6px;
        background: rgba(20, 24, 32, 0.92);
        color: #eee;
        font-size: 14px;
    }
    #concept-search:focus { outline: 1px solid #4a9eff; }
    .search-nav {
        position: absolute;
        right: 6px;
        top: 5px;
        display: flex;
        align-items: center;
        gap: 4px;
        color: #aaa;
        font-size: 12px;
    }
    .search-nav button {
        background: none;
        border: none;
        color: #4a9eff;
        font-size: 16px;
        cursor: pointer;
        padding: 0 4px;
    }
    .search-results {
        margin-top: 4px;
        max-height: 40vh;
        overflow-y: auto;
        background: rgba(20, 24, 32, 0.97);
        border: 1px solid #444;
        border-radius: 6px;
    }
    .search-result {
        padding: 8px 12px;
        cursor: pointer;
        border-bottom: 1px solid #2a2f3a;
    }
    .search-result:last-child { border-bottom: none; }
    .search-result.selected, .search-result:hover { background: rgba(74, 158, 255, 0.15); }
    .search-result .sr-title { color: #eee; font-size: 13px; font-weight: 600; }
    .search-result .sr-snippet { color: #999; font-size: 12px; }
    .search-result mark { background: rgba(74, 158, 255, 0.4); color: #fff; }

    /* Fullscreen styles */
    .viewer-wrapper:fullscreen {
        height: 100vh !important;
        max-height: 100vh;
    }

    .viewer-wrapper:-webkit-full-screen {
        height: 100vh !important;
    }

    .viewer-wrapper:-moz-full-screen {
        height: 100vh !important;
    }

    /* iOS Safari fallback — Fullscreen API doesn't support arbitrary elements */
    .viewer-wrapper.pseudo-fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-height: 100vh;
        max-height: 100dvh;
        z-index: 9999;
        margin: 0;
        border: none;
    }

    body.pseudo-fullscreen-lock {
        overflow: hidden;
        position: fixed;
        width: 100%;
    }

    .concept-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 340px;
        max-width: 85%;
        background: rgba(16, 20, 28, 0.96);
        border-left: 1px solid #333;
        z-index: 1002;
        display: flex;
        flex-direction: column;
        color: #ddd;
    }
    .panel-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid #2a2f3a;
    }
    .panel-header h3 { flex: 1; margin: 0; font-size: 1em; color: #fff; }
    .panel-header button {
        background: none;
        border: none;
        color: #4a9eff;
        font-size: 18px;
        cursor: pointer;
        padding: 0 4px;
    }
    .panel-body { padding: 14px; overflow-y: auto; font-size: 14px; line-height: 1.5; }
    #panel-context { color: #999; font-style: italic; font-size: 13px; }
    .panel-links h4 { margin: 14px 0 6px; font-size: 12px; color: #888; text-transform: none; }
    .panel-links .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
        background: rgba(74, 158, 255, 0.15);
        border: 1px solid rgba(74, 158, 255, 0.4);
        color: #9cc7ff;
        border-radius: 12px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
    }
    .chip:hover { background: rgba(74, 158, 255, 0.35); }
    @media (max-width: 768px) {
        .concept-panel {
            top: auto;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            height: 45vh;
            border-left: none;
            border-top: 1px solid #333;
        }
    }

</style>

<div class="mindmap-container">
    <div class="mindmap-header">
        <h2>{{ mindmap_title }}</h2>
    </div>

    <div class="viewer-wrapper" id="viewer-wrapper" style="background: {{ background_color }};">
        <div class="loading-overlay" id="loading-overlay">
            <div class="loading-text">Loading mindmap...</div>
            <div class="loading-bar-container">
                <div class="loading-bar indeterminate" id="loading-bar"></div>
            </div>
        </div>

        <div class="viewer-controls">
            <button id="zoom-in-btn" title="Zoom In">+</button>
            <button id="zoom-out-btn" title="Zoom Out">−</button>
            <button id="reset-btn" title="Reset View">⌂</button>
            <button id="fullscreen-btn" title="Fullscreen">⛶</button>
        </div>

        <div class="search-bar" id="search-bar" hidden>
            <input type="text" id="concept-search" placeholder="Search concepts…"
                   autocomplete="off" spellcheck="false">
            <div class="search-nav" id="search-nav" hidden>
                <button id="search-prev" title="Previous match">‹</button>
                <span id="search-counter"></span>
                <button id="search-next" title="Next match">›</button>
            </div>
            <div class="search-results" id="search-results" hidden></div>
        </div>

        <aside class="concept-panel" id="concept-panel" hidden>
            <div class="panel-header">
                <button id="panel-back" title="Back" hidden>←</button>
                <h3 id="panel-title"></h3>
                <button id="panel-close" title="Close">×</button>
            </div>
            <div class="panel-body">
                <div id="panel-text"></div>
                <p id="panel-context" hidden></p>
                <div id="panel-links-out" class="panel-links" hidden>
                    <h4>→ Links</h4><div class="chips"></div>
                </div>
                <div id="panel-links-in" class="panel-links" hidden>
                    <h4>← Backlinks</h4><div class="chips"></div>
                </div>
            </div>
        </aside>

        <div id="svg-container">
            <div id="panzoom-content">
                <object id="svg-object" type="image/svg+xml" data="{% static svg_path %}"
                        data-index-url="{% static index_path %}">
                    Your browser does not support SVG
                </object>
                <div id="overlay-layer"></div>
            </div>
        </div>
    </div>
</div>

<!-- Panzoom library -->
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="{% static 'assets/js/mindmap_notes.js' %}"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const svgObject = document.getElementById('svg-object');
    const container = document.getElementById('svg-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingBar = document.getElementById('loading-bar');
    const viewerWrapper = document.getElementById('viewer-wrapper');

    let panzoomInstance = null;

    // Wait for SVG to load
    svgObject.addEventListener('load', function() {
        // Animate loading bar to 100% then hide overlay
        loadingBar.classList.remove('indeterminate');
        loadingBar.style.width = '100%';

        setTimeout(function() {
            loadingOverlay.classList.add('hidden');
        }, 400);

        // Initialize panzoom on the wrapper element (object + overlay layer)
        const panzoomContent = document.getElementById('panzoom-content');
        panzoomInstance = Panzoom(panzoomContent, {
            maxScale: 50,
            minScale: 0.1,
            startScale: 10,
            contain: false,
            cursor: 'grab',
        });

        // Enable mouse wheel zoom
        container.addEventListener('wheel', function(event) {
            panzoomInstance.zoomWithWheel(event);
        });

        // Custom drag handling (since pointer-events: none blocks native drag)
        let isDragging = false;
        let startX, startY;

        container.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return; // Only left mouse button
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            container.style.cursor = 'grabbing';
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            // Get current pan values and add delta
            const pan = panzoomInstance.getPan();
            panzoomInstance.pan(pan.x + dx, pan.y + dy, { animate: false });

            // Update start position for next move
            startX = e.clientX;
            startY = e.clientY;
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                container.style.cursor = 'grab';
            }
        });

        // Touch handling — single-finger pan, two-finger pinch-zoom.
        // preventDefault + touch-action: none stops Safari from scrolling the page.
        let lastTouchX = 0, lastTouchY = 0;
        let lastPinchDistance = 0;
        let touchMode = null; // 'pan' | 'pinch' | null

        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        container.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                touchMode = 'pan';
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            } else if (e.touches.length >= 2) {
                touchMode = 'pinch';
                lastPinchDistance = getPinchDistance(e.touches);
            }
            e.preventDefault();
        }, { passive: false });

        container.addEventListener('touchmove', function(e) {
            if (touchMode === 'pan' && e.touches.length === 1) {
                const tx = e.touches[0].clientX;
                const ty = e.touches[0].clientY;
                const dx = tx - lastTouchX;
                const dy = ty - lastTouchY;
                const pan = panzoomInstance.getPan();
                panzoomInstance.pan(pan.x + dx, pan.y + dy, { animate: false });
                lastTouchX = tx;
                lastTouchY = ty;
            } else if (touchMode === 'pinch' && e.touches.length >= 2) {
                const dist = getPinchDistance(e.touches);
                if (lastPinchDistance > 0) {
                    const factor = dist / lastPinchDistance;
                    const scale = panzoomInstance.getScale();
                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    panzoomInstance.zoomToPoint(scale * factor, {
                        clientX: midX,
                        clientY: midY,
                    }, { animate: false });
                }
                lastPinchDistance = dist;
            }
            e.preventDefault();
        }, { passive: false });

        function endTouch(e) {
            if (e.touches.length === 0) {
                touchMode = null;
                lastPinchDistance = 0;
            } else if (e.touches.length === 1) {
                // Lifted one finger from a pinch — resume panning from the remaining finger.
                touchMode = 'pan';
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                lastPinchDistance = 0;
            }
        }

        container.addEventListener('touchend', endTouch);
        container.addEventListener('touchcancel', endTouch);

        // Zoom buttons
        document.getElementById('zoom-in-btn').addEventListener('click', function() {
            panzoomInstance.zoomIn();
        });

        document.getElementById('zoom-out-btn').addEventListener('click', function() {
            panzoomInstance.zoomOut();
        });

        // Reset button
        document.getElementById('reset-btn').addEventListener('click', function() {
            panzoomInstance.reset();
        });

        // Fullscreen — iOS Safari doesn't support Fullscreen API on arbitrary elements,
        // so fall back to a CSS pseudo-fullscreen that fixes the wrapper to the viewport.
        function isFullscreenActive() {
            return document.fullscreenElement === viewerWrapper
                || document.webkitFullscreenElement === viewerWrapper
                || viewerWrapper.classList.contains('pseudo-fullscreen');
        }

        function enterPseudoFullscreen() {
            viewerWrapper.classList.add('pseudo-fullscreen');
            document.body.classList.add('pseudo-fullscreen-lock');
        }

        function exitPseudoFullscreen() {
            viewerWrapper.classList.remove('pseudo-fullscreen');
            document.body.classList.remove('pseudo-fullscreen-lock');
        }

        function toggleFullscreen() {
            if (viewerWrapper.classList.contains('pseudo-fullscreen')) {
                exitPseudoFullscreen();
                return;
            }
            const native = viewerWrapper.requestFullscreen || viewerWrapper.webkitRequestFullscreen;
            if (native) {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    const result = native.call(viewerWrapper);
                    if (result && typeof result.catch === 'function') {
                        result.catch(enterPseudoFullscreen);
                    }
                }
            } else {
                enterPseudoFullscreen();
            }
        }

        document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            switch(e.key.toLowerCase()) {
                case '+':
                case '=':
                    panzoomInstance.zoomIn();
                    e.preventDefault();
                    break;
                case '-':
                    panzoomInstance.zoomOut();
                    e.preventDefault();
                    break;
                case 'h':
                case 'home':
                    panzoomInstance.reset();
                    e.preventDefault();
                    break;
                case 'f':
                    toggleFullscreen();
                    e.preventDefault();
                    break;
                case 'escape':
                    if (viewerWrapper.classList.contains('pseudo-fullscreen')) {
                        exitPseudoFullscreen();
                        e.preventDefault();
                    }
                    break;
            }
        });

        if (window.MindmapNotes) {
            MindmapNotes.init({
                panzoom: panzoomInstance,
                content: panzoomContent,
                container: container,
                wrapper: viewerWrapper,
            });
        }
    });

    // Handle load error
    svgObject.addEventListener('error', function() {
        const loadingText = loadingOverlay.querySelector('.loading-text');
        loadingText.textContent = 'Failed to load mindmap. Please try refreshing.';
        loadingBar.classList.remove('indeterminate');
        loadingBar.style.background = '#ff6b6b';
        loadingBar.style.width = '100%';
    });
});
</script>

{% endblock content %}
